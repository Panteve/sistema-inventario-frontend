<!-- Busqueda -->
<div class="mb-2 flex items-center gap-2">
  <label
    class="du-input du-input-bordered w-full rounded-xl border-base-content/15 bg-base-100 shadow-sm"
  >
    <svg class="h-4 w-4 opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <g
        stroke-linejoin="round"
        stroke-linecap="round"
        stroke-width="2.5"
        fill="none"
        stroke="currentColor"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </g>
    </svg>
    <input
      #search
      class="grow"
      placeholder="Buscar por nombre o ID..."
      (input)="globalFilter.set(search.value); resetViewTable()"
    />
  </label>

  <div class="du-tooltip du-tooltip-left" data-tip="Recargar productos">
    <button class="du-btn du-btn-circle du-btn-soft" (click)="this.loadProducts()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 0 0-8 8a8 8 0 0 0 8 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18a6 6 0 0 1-6-6a6 6 0 0 1 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"
        />
      </svg>
    </button>
  </div>
</div>

<div class="overflow-hidden rounded-2xl border border-base-content/10 bg-base-100 shadow-sm">
  <div class="overflow-x-auto">
    <table class="du-table du-table-zebra du-table-sm md:du-table-md w-full">
      <thead class="bg-base-200/90">
        <tr>
          <th class="text-center text-xs font-semibold uppercase tracking-[0.14em]">Nombre</th>
          <th class="text-center text-xs font-semibold uppercase tracking-[0.14em]">Precio</th>
          <th class="text-center text-xs font-semibold uppercase tracking-[0.14em]">P. Mayor</th>
          <th class="text-center text-xs font-semibold uppercase tracking-[0.14em]">Stock</th>
        </tr>
      </thead>
      <tbody>
        @for (row of table.getRowModel().rows; track row.id) {
          <tr
            class="transition-colors duration-200 hover:bg-base-300/80"
            [class.cursor-pointer]="enableRowSelect()"
            [class.bg-warning/20]="isLowStock(row.original.quantity)"
            [class.hover:bg-warning/30]="isLowStock(row.original.quantity)"
            [class.bg-error/20]="isNegativeStock(row.original.quantity)"
            [class.hover:bg-error/30]="isNegativeStock(row.original.quantity)"
            (click)="onRowClick(row.original)"
          >
            @for (cell of row.getVisibleCells(); track cell.id) {
              <td class="text-center align-middle text-sm">
                <ng-container
                  *flexRender="
                    cell.column.columnDef.cell;
                    props: cell.getContext();
                    let renderedCell
                  "
                >
                  <div
                    [class.text-warning]="
                      isStockCell(cell.column.id) && isLowStock(row.original.quantity)
                    "
                    [class.text-error]="
                      isStockCell(cell.column.id) && isNegativeStock(row.original.quantity)
                    "
                    [class.font-semibold]="isStockCell(cell.column.id) && enableStockStatus()"
                    [innerHTML]="renderedCell"
                  ></div>
                </ng-container>
              </td>
            }
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="py-10 text-center opacity-55">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="mx-auto mb-2 h-11 w-11 opacity-35"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
                />
              </svg>
              <p class="text-sm">No hay productos disponibles</p>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<!-- Paginacion -->
<div class="mt-3 flex justify-center">
  <div class="du-join rounded-xl border border-base-content/10 bg-base-100 p-1 shadow-sm">
    <button
      class="du-join-item du-btn du-btn-sm"
      (click)="previousPage()"
      [disabled]="!table.getCanPreviousPage()"
      aria-label="Pagina anterior"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
        <path fill="currentColor" d="M15.41 7.41L14 6l-6 6l6 6l1.41-1.41L10.83 12z" />
      </svg>
    </button>

    <button class="du-join-item du-btn du-btn-sm" (click)="resetViewTable()">
      {{ numberPage() }}
    </button>

    <button
      class="du-join-item du-btn du-btn-sm"
      (click)="nextPage()"
      [disabled]="!table.getCanNextPage()"
      aria-label="Pagina siguiente"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
        <path fill="currentColor" d="M10 6L8.59 7.41L13.17 12l-4.58 4.59L10 18l6-6z" />
      </svg>
    </button>
  </div>
</div>
