<div
  class="gap-4"
  [class.flex]="inLine() === false"
  [class.flex-col]="inLine() === false"
  [class.grid]="inLine() === true"
  [class.grid-cols-2]="inLine() === true"
>
  <div class="du-join w-full">
    <button
      class="du-btn du-btn-sm du-join-item flex-1 border-primary/20"
      type="button"
      (click)="setTodayRange()"
      [class.du-btn-primary]="isTodayRange()"
    >
      Hoy
    </button>
    <button
      class="du-btn du-btn-sm du-join-item flex-1 border-primary/20"
      type="button"
      (click)="setCurrentWeekRange()"
      [class.du-btn-primary]="isCurrentWeekRange()"
    >
      Semana
    </button>
    <button
      class="du-btn du-btn-sm du-join-item flex-1 border-primary/20"
      type="button"
      (click)="setCurrentMonthRange()"
      [class.du-btn-primary]="isCurrentMonthRange()"
    >
      Mes
    </button>
  </div>

  <fieldset class="w-full min-w-0">
    <button
      class="du-input du-input-bordered flex w-full items-center justify-between gap-2 cursor-pointer"
      [class.du-input-sm]="size() === 'sm'"
      [attr.popovertarget]="popoverId"
      [id]="buttonId"
      [style.anchor-name]="anchorName"
      type="button"
    >
      <span class="truncate text-left">
        {{ startDate() | date: 'yyyy-MM-dd' }} — {{ endDate() | date: 'yyyy-MM-dd' }}
      </span>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        class="shrink-0 opacity-70"
        aria-hidden="true"
      >
        <path
          fill="currentColor"
          d="M7 11h2v2H7zm0 4h2v2H7zm4-4h2v2h-2zm0 4h2v2h-2zm4-4h2v2h-2zm0 4h2v2h-2z"
        />
        <path
          fill="currentColor"
          d="M5 22h14c1.103 0 2-.897 2-2V6c0-1.103-.897-2-2-2h-2V2h-2v2H9V2H7v2H5c-1.103 0-2 .897-2 2v14c0 1.103.897 2 2 2M19 8l.001 12H5V8z"
        />
      </svg>
    </button>
    <div
      popover
      [id]="popoverId"
      class="du-dropdown bg-base-100 rounded-box shadow-lg p-4 overflow-visible w-fit"
      [style.position-anchor]="anchorName"
    >
      <calendar-range
        [max]="todayIso()"
        [value]="rangeValue"
        (rangestart)="onRangeStart($event)"
        (rangeend)="onRangeEnd($event)"
      >
        <svg
          aria-label="Previous"
          slot="previous"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          style="width: 16px; height: 16px"
        >
          <path d="M15.75 19.5 8.25 12l7.5-7.5"></path>
        </svg>
        <svg
          aria-label="Next"
          slot="next"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          style="width: 16px; height: 16px"
        >
          <path d="m8.25 4.5 7.5 7.5-7.5 7.5"></path>
        </svg>
        <div style="display: flex; gap: 1rem">
          <calendar-month></calendar-month>
          <calendar-month offset="1"></calendar-month>
        </div>
      </calendar-range>
    </div>
  </fieldset>
</div>
