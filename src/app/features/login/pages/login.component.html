<div class="h-screen flex items-center justify-center">
  <div class="du-card w-full max-w-md bg-base-100 shadow-2xl rounded-4xl">
    <div class="du-card-body">
      <!-- Header -->
      <div class="text-center mb-6 items-center justify-center flex flex-col gap-2">
        <h2 class="du-card-title justify-center text-2xl">Bienvenido</h2>
        <p class="text-sm opacity-70">Sistema de Inventario</p>
        <img src="icons/Print.svg" loading="eager" fetchpriority=high class="w-3/5 h-3/5" />
      </div>

      <form (submit)="onSubmit($event)" class="space-y-5">
        <!-- PHONE -->
        <div class="du-form-control">
          <label class="du-label">
            <span class="du-label-text font-medium">Documento</span>
          </label>

          <label class="du-input du-input-primary du-flex du-items-center du-gap-2 w-full">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              class="du-opacity-60"
            >
              <path
                fill="currentColor"
                d="M18 13q.425 0 .713-.288T19 12t-.288-.712T18 11h-3q-.425 0-.712.288T14 12t.288.713T15 13zm0-3q.425 0 .713-.288T19 9t-.288-.712T18 8h-3q-.425 0-.712.288T14 9t.288.713T15 10zm-9 3q-.9 0-1.625.163t-1.275.512q-.525.325-.8.738t-.275.887q0 .3.225.5t.55.2h6.4q.325 0 .55-.213t.225-.537q0-.425-.275-.825t-.8-.75q-.55-.35-1.275-.513T9 13m0-1q.825 0 1.412-.587T11 10t-.587-1.412T9 8t-1.412.588T7 10t.588 1.413T9 12m-5 8q-.825 0-1.412-.587T2 18V6q0-.825.588-1.412T4 4h16q.825 0 1.413.588T22 6v12q0 .825-.587 1.413T20 20zm0-2h16V6H4zm0 0V6z"
              />
            </svg>

            <input
              type="text"
              placeholder="Ingrese su documento"
              class="du-grow"
              [formField]="loginForm.document"
            />
          </label>
        </div>

        <!-- PASSWORD -->
        <div>
          <label class="du-label">
            <span class="du-label-text font-medium">Contraseña</span>
          </label>

          <label class="du-input du-input-primary flex items-center gap-2 w-full">
            <svg class="h-4 w-4 opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <g
                stroke-linejoin="round"
                stroke-linecap="round"
                stroke-width="2.5"
                fill="none"
                stroke="currentColor"
              >
                <path
                  d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
                />
                <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" />
              </g>
            </svg>

            <input
              type="password"
              class="grow"
              [formField]="loginForm.password"
              placeholder="Ingrese su contraseña"
              title="Must be more than 8 characters, including number, lowercase letter, uppercase letter"
            />
          </label>
        </div>
        <!-- BUTTON -->
        @if (!this.authStore.loading()) {
          <button class="du-btn du-btn-primary w-full mb-0">Login</button>
        } @else {
          <button class="du-btn du-btn-primary w-full mb-0"disabled>
            <span class="du-loading du-loading-spinner"></span>
            Loading
          </button>
        }
      </form>
    </div>
  </div>
</div>
