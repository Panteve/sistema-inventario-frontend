<div class="flex flex-col gap-4 py-2">
  <div class="text-center">
    <h3 class="text-xl font-bold">{{ billStore.productSelected().product.name }}</h3>
    <p class="text-sm opacity-50">Selecciona el tipo de precio</p>
  </div>

  <div class="flex flex-col gap-3">
    <!-- Precio Unitario -->
    <button
      class="du-btn du-btn-outline du-btn-block justify-between h-auto py-4 px-5 normal-case"
      (click)="addProductToBill('unitPrice')"
    >
      <div class="flex flex-col items-start">
        <span class="text-sm opacity-50 font-normal">Precio unitario</span>
        <span class="text-lg font-semibold">{{
          billStore.productSelected().product.unitPrice | currency
        }}</span>
      </div>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="30"
        height="30"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M5 12h14m-7-7l7 7-7 7" />
      </svg>
    </button>

    <!-- Precio Mayorista -->
    <button
      class="du-btn du-btn-outline du-btn-block justify-between h-auto py-4 px-5 normal-case"
      (click)="addProductToBill('wholesalePrice')"
      [disabled]="!billStore.productSelected().product.wholesalePrice"
    >
      <div class="flex flex-col items-start">
        <span class="text-sm opacity-50 font-normal">Precio mayorista</span>
        <span class="text-lg font-semibold">{{
          billStore.productSelected().product.wholesalePrice | currency
        }}</span>
      </div>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="30"
        height="30"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M5 12h14m-7-7l7 7-7 7" />
      </svg>
    </button>
  </div>
</div>
