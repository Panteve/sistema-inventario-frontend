<div class="relative rounded-3xl h-fit px-4 py-2 md:py-3">
  <div class="relative z-10 mx-auto w-full max-w-5xl">
    <div class="mb-3 flex items-center gap-2">
      <div
        class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-accent/10 ring-1 ring-accent/20"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5 text-accent"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z"
          />
        </svg>
      </div>
      <div>
        @if (authStore.cashRegisterIsOpen()) {
          <h1 class="text-xl font-bold tracking-tight">Cierre de caja</h1>
          <p class="text-sm opacity-50">Valida el efectivo físico y revisa el cuadre final.</p>
        } @else {
          <h1 class="text-xl font-bold tracking-tight">Apertura de caja</h1>
          <p class="text-sm opacity-50">Registra el monto inicial para comenzar la jornada.</p>
        }
      </div>
    </div>

    <div class="du-card rounded-3xl border border-base-content/10 bg-base-100 shadow-xl">
      <div class="du-card-body p-2.5 md:p-3">
        @if (authStore.cashRegisterIsOpen()) {
          <app-close-cash-register
            [employee]="authStore.employee()"
            [cashRegisterSummary]="cashRegisterStore.cashRegisterSummary()"
            [loading]="cashRegisterStore.loading()"
            [loadingSummary]="cashRegisterStore.loadingSummary()"
            (closeModal)="closeCashModal()"
            (closeCashRegister)="closeCashRegister($event)"
          ></app-close-cash-register>
        } @else {
          <app-open-cash-register
            [employee]="authStore.employee()"
            [officesList]="officeStore.offices()"
            [loading]="cashRegisterStore.loading()"
            (closeModal)="closeCashModal()"
            (openCashRegister)="openCashRegister($event)"
          ></app-open-cash-register>
        }

      </div>
    </div>
  </div>
</div>
