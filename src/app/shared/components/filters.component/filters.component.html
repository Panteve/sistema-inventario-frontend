<div class="grid grid-cols-1 gap-3 xl:grid-cols-3">
  <fieldset
    class="du-fieldset rounded-xl border border-base-content/10 bg-base-100/70 px-3 pb-3 pt-2"
  >
    <legend class="du-fieldset-legend text-[11px] uppercase tracking-wide opacity-60">
      Fechas
    </legend>
    <app-date-range-popover
      [startDate]="startDate()"
      [endDate]="endDate()"
      [isAdmin]="authStore.isAdmin()"
      (rangeStart)="changeStartDate($event)"
      (rangeEnd)="changeEndDate($event)"
    >
    </app-date-range-popover>
  </fieldset>

  <div>
    <fieldset
      class="du-fieldset rounded-xl border border-base-content/10 bg-base-100/70 px-3 pb-3 pt-2"
    >
      <legend class="du-fieldset-legend text-xs opacity-60 tracking-[0.16em] uppercase">
        Empleado
      </legend>
      <app-employee-select
        [size]="size()"
        [value]="employeeId()"
        [idOffice]="officeId()"
        (idEmployee)="changeEmployeeId($event)"
        (nameEmployee)="changeEmployeeName($event)"
      />
    </fieldset>
    <fieldset
      class="du-fieldset rounded-xl border border-base-content/10 bg-base-100/70 px-3 pb-3 pt-2"
    >
      <legend class="du-fieldset-legend text-xs opacity-60 tracking-[0.16em] uppercase">
        Sucursal
      </legend>
      @if (authStore.isAdmin()) {
        <app-office-select
          [size]="size()"
          [value]="officeId()"
          (idOffice)="changeOfficeId($event)"
          (nameOffice)="changeOfficeName($event)"
        />
      } @else {
        <input
          type="text"
          class="du-input du-input-sm du-input-bordered w-full"
          [value]="authStore.employee()?.officeName"
          disabled
        />
      }
    </fieldset>
  </div>
  <div>
    <fieldset
      class="du-fieldset rounded-xl border border-base-content/10 bg-base-100/70 px-3 pb-3 pt-2"
    >
      <legend class="du-fieldset-legend text-xs opacity-60 tracking-[0.16em] uppercase">
        Por página
      </legend>
      <input
        type="number"
        class="du-input du-input-bordered w-full"
        [class.du-input-sm]="size() === 'sm'"
        min="5"
        max="100"
        [value]="pageSize()"
        (change)="changeItemsPerPage($event)"
      />
    </fieldset>
    <ng-content />
  </div>
</div>
