<div class="w-full overflow-hidden">
  <!-- Header -->
  <div class="flex items-center justify-between mb-5">
    <div>
      <h2 class="text-xl font-bold">Productos disponibles</h2>
      <p class="text-sm opacity-50">Selecciona un producto para agregarlo</p>
    </div>
  </div>
  @if (this.inventoryStore.loading()) {
    <div class="flex flex-col items-center justify-center py-12 gap-3">
      <span class="du-loading du-loading-spinner du-loading-lg text-primary"></span>
      <span class="text-sm opacity-60">Cargando productos...</span>
    </div>
  } @else {
    <app-table-products
      [enableRowSelect]="true"
      [quantityProducts]="10"
      (rowSelected)="getProductTable($event)"
    ></app-table-products>
  }

  <!-- Modal precios -->
  <dialog id="my_modal_2" #my_modal_2 class="du-modal">
    <div class="du-modal-box">
      <form method="dialog">
        <button
          #btnCerrar
          class="du-btn du-btn-sm du-btn-circle du-btn-ghost absolute right-3 top-3"
        >
          ✕
        </button>
      </form>
      <router-outlet name="select-product-price" />
    </div>
    <form method="dialog" class="du-modal-backdrop">
      <button>close</button>
    </form>
  </dialog>
  
</div>
