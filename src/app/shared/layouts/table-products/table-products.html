<!-- Búsqueda -->
<div class="flex gap-2">
  <label class="du-input du-input-bordered w-full mb-4 flex items-center gap-2">
    <svg class="h-4 w-4 opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <g
        stroke-linejoin="round"
        stroke-linecap="round"
        stroke-width="2.5"
        fill="none"
        stroke="currentColor"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </g>
    </svg>
    <input
      #search
      class="grow"
      placeholder="Buscar por nombre o ID..."
      (input)="globalFilter.set(search.value); resetViewTable()"
    />
  </label>
  <div class="du-tooltip du-tooltip-left" data-tip="Recargar productos">
    <button class="du-btn du-btn-circle du-btn-ghost" (click)="this.loadProducts()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 0 0-8 8a8 8 0 0 0 8 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18a6 6 0 0 1-6-6a6 6 0 0 1 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"
        />
      </svg>
    </button>
  </div>
</div>

<div class="overflow-hidden rounded-xl border border-base-content/10">
  <table class="du-table du-table-zebra du-table-md w-full">
    <thead class="bg-base-200">
      <tr>
        <th class="text-center">ID</th>
        <th class="text-center">Nombre</th>
        <th class="text-center">Precio</th>
        <th class="text-center">P. Mayor</th>
        <th class="text-center">Stock</th>
      </tr>
    </thead>
    <tbody>
      @for (row of table.getRowModel().rows; track row.id) {
        <tr
          class="hover:bg-base-300 transition-colors"
          [class.cursor-pointer]="enableRowSelect()"
          [class.bg-warning/20]="isLowStock(row.original.quantity)"
          [class.hover:bg-warning/30]="isLowStock(row.original.quantity)"
          [class.bg-error/20]="isNegativeStock(row.original.quantity)"
          [class.hover:bg-error/30]="isNegativeStock(row.original.quantity)"
          (click)="onRowClick(row.original)"
        >
          @for (cell of row.getVisibleCells(); track cell.id) {
            <td class="text-center">
              <ng-container
                *flexRender="cell.column.columnDef.cell; props: cell.getContext(); let renderedCell"
              >
                <div
                  [class.text-warning]="
                    isStockCell(cell.column.id) && isLowStock(row.original.quantity)
                  "
                  [class.text-error]="
                    isStockCell(cell.column.id) && isNegativeStock(row.original.quantity)
                  "
                  [class.font-semibold]="isStockCell(cell.column.id) && enableStockStatus()"
                  [innerHTML]="renderedCell"
                ></div>
              </ng-container>
            </td>
          }
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="text-center py-8 opacity-50">No se encontraron productos</td>
        </tr>
      }
    </tbody>
  </table>
</div>

<!-- Paginación -->
<div class="flex justify-center mt-4">
  <div class="du-join">
    <button
      class="du-join-item du-btn du-btn-sm"
      (click)="previousPage()"
      [disabled]="!table.getCanPreviousPage()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
        <path fill="currentColor" d="M15.41 7.41L14 6l-6 6l6 6l1.41-1.41L10.83 12z" />
      </svg>
    </button>
    <button class="du-join-item du-btn du-btn-sm" (click)="resetViewTable()">
      {{ numberPage() }}
    </button>
    <button
      class="du-join-item du-btn du-btn-sm"
      (click)="nextPage()"
      [disabled]="!table.getCanNextPage()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
        <path fill="currentColor" d="M10 6L8.59 7.41L13.17 12l-4.58 4.59L10 18l6-6z" />
      </svg>
    </button>
  </div>
</div>
