<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8">
  <title>SistemaInventarioFrontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
  <script>
    (function() {
      'use strict';
      var rm = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

      /* ── SCROLL REVEAL ── */
      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function(entries) {
          entries.forEach(function(e) {
            if (!e.isIntersecting) return;
            e.target.classList.add('is-visible');
            io.unobserve(e.target);
          });
        }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

        document.querySelectorAll('[data-reveal]').forEach(function(el) {
          if (rm) { el.classList.add('is-visible'); return; }
          io.observe(el);
        });

        /* Stagger containers need their own observer */
        var staggerIo = new IntersectionObserver(function(entries) {
          entries.forEach(function(e) {
            if (!e.isIntersecting) return;
            e.target.classList.add('is-visible');
            staggerIo.unobserve(e.target);
          });
        }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

        document.querySelectorAll('.reveal-stagger').forEach(function(el) {
          if (rm) { el.classList.add('is-visible'); return; }
          staggerIo.observe(el);
        });
      } else {
        document.querySelectorAll('[data-reveal]').forEach(function(el) { el.classList.add('is-visible'); });
        document.querySelectorAll('.reveal-stagger').forEach(function(el) { el.classList.add('is-visible'); });
      }

      /* ── COUNTER ANIMATION ── */
      if (!rm && 'IntersectionObserver' in window) {
        var cio = new IntersectionObserver(function(entries) {
          entries.forEach(function(e) {
            if (!e.isIntersecting) return;
            var el = e.target;
            var to = parseInt(el.dataset.count, 10);
            var pre = el.dataset.countPrefix || '';
            var suf = el.dataset.countSuffix || '';
            var dur = parseInt(el.dataset.countDur, 10) || 1400;
            cio.unobserve(el);
            if (rm) { el.textContent = pre + to + suf; return; }
            var start = 0, step = 16, steps = dur / step;
            var increment = Math.max(1, Math.ceil(to / steps));
            var t = setInterval(function() {
              start += increment;
              if (start >= to) { el.textContent = pre + to + suf; clearInterval(t); return; }
              el.textContent = pre + start + suf;
            }, step);
          });
        }, { threshold: 0.3 });

        document.querySelectorAll('[data-count]').forEach(function(el) { cio.observe(el); });
      } else {
        document.querySelectorAll('[data-count]').forEach(function(el) {
          el.textContent = (el.dataset.countPrefix||'') + el.dataset.count + (el.dataset.countSuffix||'');
        });
      }

      /* ── MUTATION OBSERVER for dynamically added content ── */
      var mo = new MutationObserver(function() {
        document.querySelectorAll('[data-reveal]:not(.is-visible)').forEach(function(el) {
          if (rm) { el.classList.add('is-visible'); return; }
          io.observe(el);
        });
        document.querySelectorAll('.reveal-stagger:not(.is-visible)').forEach(function(el) {
          if (rm) { el.classList.add('is-visible'); return; }
          staggerIo.observe(el);
        });
        document.querySelectorAll('[data-count]').forEach(function(el) {
          if (!el.dataset.count) return;
          if (!el.textContent || el.textContent === '0' || el.textContent === pre + '0' + suf) {
            cio.observe(el);
          }
        });
      });
      mo.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
