<div class="flex justify-center px-4 py-10 md:py-14">
  <div class="w-full max-w-7xl mx-auto" (click)="clearProductSelected($event)">


    <div class="grid grid-cols-1 lg:grid-cols-[340px_1fr] gap-4 lg:gap-6 items-start">
      <article data-reveal="up" class="du-card rounded-4xl bg-base-100 border border-base-content/10 shadow-sm">
        <div class="du-card-body p-4 md:p-6">
          <div data-exception class="p-2">
            <h3 class="text-sm font-semibold uppercase tracking-[0.12em] opacity-80 mb-4">
              Producto
            </h3>

            <form class="space-y-3" [formGroup]="productForm" (ngSubmit)="onSubmit()">
              <fieldset class="du-fieldset">
                <legend class="du-fieldset-legend">Nombre</legend>
                <input
                  type="text"
                  class="du-input w-full"
                  formControlName="name"
                  placeholder="Ej: Mouse inalámbrico"
                />
              </fieldset>

              <fieldset class="du-fieldset">
                <legend class="du-fieldset-legend">Descripción</legend>
                <textarea
                  class="du-textarea w-full resize-none max-h-32 overflow-y-auto"
                  formControlName="description"
                  placeholder="Ej: Mouse inalámbrico 2.4G con batería recargable"
                  maxlength="256"
                  rows="2"
                ></textarea>
                <div class="flex justify-end">
                  <span class="text-[11px] text-base-content/60">
                    {{ productForm.get('description')?.value?.length ?? 0 }}/256
                  </span>
                </div>
              </fieldset>

              <fieldset class="du-fieldset">
                <legend class="du-fieldset-legend">Precio unitario</legend>
                <input
                  copMoneyInput
                  type="text"
                  autocomplete="off"
                  inputmode="numeric"
                  class="du-input w-full no-spinner"
                  formControlName="unitPrice"
                />
              </fieldset>
              <fieldset class="du-fieldset">
                <legend class="du-fieldset-legend">Precio por mayor</legend>
                <input
                  copMoneyInput
                  type="text"
                  autocomplete="off"
                  inputmode="numeric"
                  class="du-input w-full no-spinner"
                  formControlName="wholesalePrice"
                />
              </fieldset>

              <fieldset class="du-fieldset w-fit">
                <legend class="du-fieldset-legend">Status</legend>
                <label class="du-label justify-start gap-3">
                  <input
                    type="checkbox"
                    class="du-toggle du-toggle-success"
                    formControlName="status"
                    [value]="productForm.get('status')?.value"
                  />
                  <span class="du-label-text">
                    {{ productForm.get('status')?.value ? 'Activo' : 'Inactivo' }}
                  </span>
                </label>
              </fieldset>

              <div class="flex gap-2 pt-2">
                <button
                  class="du-btn du-btn-soft flex-1"
                  type="button"
                  (click)="onProductFormReset()"
                >
                  Limpiar
                </button>
                <button
                  class="du-btn du-btn-primary flex-1"
                  type="submit"
                  [disabled]="productForm.invalid || !hasChanges()"
                >
                  {{ this.productExist() ? 'Guardar' : 'Crear' }}
                </button>
              </div>
            </form>
          </div>
        </div>
      </article>

      <article data-reveal="up" class="du-card rounded-4xl bg-base-100 border border-base-content/10 shadow-sm">
        <div class="du-card-body p-4 md:p-6">
          @if (productCatalogStore.loading()) {
            <div class="text-center py-10 opacity-50">
              <span class="du-loading du-loading-dots du-loading-xl"></span>
              <p>Cargando productos...</p>
            </div>
          } @else {
            <div class="min-w-0" data-keep-product-selected>
              <app-table-catalog-products
                [manageProduct]="true"
                [showDelete]="true"
                (rowSelected)="setProductSelected($event)"
              />
            </div>
          }
        </div>
      </article>
    </div>
  </div>
</div>
