<h3 class="text-xl font-bold mb-4">Confirmar pago</h3>
<div class="flex flex-col gap-5">
  <!-- Método de pago -->
  <div class="w-full">
    <label class="du-label">
      <span class="du-label-text font-semibold">Método de pago</span>
    </label>
    <select class="du-select du-select-bordered w-full" (change)="onPaymentMethodChange($event)">
      @if(paymentMethodStore.loading()) {
        <option value="0" disabled selected>Cargando métodos...</option>
      } @else {
        <option value="0" disabled selected>Seleccionar método</option>
        @for (method of paymentMethods(); track method.id) {
          <option [value]="method.id">{{ method.name }}</option>
        }
      }
    </select>
  </div>

  <!-- Resumen de totales -->
  <div class="rounded-xl bg-base-200 p-4 flex flex-col gap-2 font-mono">
    <div class="flex justify-between text-sm opacity-70">
      <span class="tracking-[0.16em]">Subtotal</span>
      <span class="font-mono">{{ billStore.subtotal() | cop }}</span>
    </div>
    <div class="flex justify-between text-sm opacity-70">
      <span class="tracking-[0.16em]">IVA (19%)</span>
      <span class="font-mono">{{ billStore.iva() | cop }}</span>
    </div>
    <div class="du-divider my-0"></div>
    <div class="flex justify-between text-xl font-bold">
      <span class="tracking-[0.16em]">Total</span>
      <span class="font-mono">{{ billStore.total() | cop }}</span>
    </div>
  </div>

  <!-- Sección de vueltas (solo efectivo) -->
  @if (affectsCash()) {
    <div class="w-full">
      <label class="du-label">
        <span class="du-label-text font-semibold">Monto recibido</span>
      </label>
      <label class="du-input du-input-bordered w-full text-lg no-spinner font-mono">
        <input
        type="text"
        
        placeholder="0"
        inputmode="numeric"
        [value]="displayAmount()"
        (input)="onAmountReceivedChange($event)"
        (click)="onAmountReceivedClick($event)"
      />
      </label>
      
    </div>

    <div
      class="flex justify-between items-center rounded-xl px-4 py-3 transition-colors font-mono"
      [class]="change() >= 0 ? 'bg-success/10' : 'bg-error/10'"
    >
      <span class="font-semibold">Vueltas</span>
      <span
        class="text-xl font-bold tabular-nums font-mono"
        [class]="change() >= 0 ? 'text-success' : 'text-error'"
      >
        {{ change() | cop }}
      </span>
    </div>
  }

  <!-- Botón confirmar -->
  <button
    class="du-btn du-btn-primary w-full du-btn-md"
    [disabled]="!canConfirm() || billStore.loading()"
    (click)="confirm()"
  >
    @if (billStore.loading()) {
      <span class="du-loading du-loading-spinner"></span>
      Procesando...
    } @else {
      Confirmar pago
    }
  </button>
</div>
