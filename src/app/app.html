<div class="aurora" aria-hidden="true">
  <div class="aurora-orb aurora-orb-1"></div>
  <div class="aurora-orb aurora-orb-2"></div>
  <div class="aurora-orb aurora-orb-3"></div>
</div>
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

<div class="du-drawer min-h-screen lg:du-drawer-open">
  <input id="my-drawer-4" type="checkbox" class="du-drawer-toggle" />
  <div class="du-drawer-content min-h-screen bg-base-content/5">
    <app-navbar />
    <main class="flex-1 px-2 py-2 md:px-3 md:py-3">
      <div class="fixed z-9999">
        <toast-notifications></toast-notifications>
      </div>
      <router-outlet />
    </main>
    @if (authStore.isAuthenticated() && cashModalOpen()) {
      <dialog class="du-modal rounded-3xl du-modal-open" (close)="closeCashModal()">
        <div class="du-modal-box rounded-3xl w-11/12 max-w-4xl">
          <button
            class="du-btn du-btn-sm du-btn-circle du-btn-ghost absolute right-3 top-3 z-10"
            aria-label="close"
            (click)="closeCashModal()"
          >
            ✕
          </button>
          <app-cash-register></app-cash-register>
        </div>
        <form method="dialog" class="du-modal-backdrop">
          <button (click)="closeCashModal()">close</button>
        </form>
      </dialog>
    }
    @if (authStore.isAuthenticated() && expenseModalOpen()) {
      <dialog class="du-modal rounded-3xl du-modal-open" (close)="closeExpenseModal()">
        <div class="du-modal-box rounded-3xl w-11/12 max-w-2xl">
          <button
            class="du-btn du-btn-sm du-btn-circle du-btn-ghost absolute right-3 top-3 z-50"
            aria-label="close"
            (click)="closeExpenseModal()"
          >
            ✕
          </button>
          <app-expense></app-expense>
        </div>
        <form method="dialog" class="du-modal-backdrop">
          <button (click)="closeExpenseModal()">close</button>
        </form>
      </dialog>
    }
  </div>
  <div
    class="du-drawer-side du-is-drawer-close:overflow-visible drawer-scrollbar"
    [attr.data-theme]="fixedLayoutTheme"
  >
    <label for="my-drawer-4" aria-label="close sidebar" class="du-drawer-overlay"></label>
    <app-sidebar />
  </div>
</div>
