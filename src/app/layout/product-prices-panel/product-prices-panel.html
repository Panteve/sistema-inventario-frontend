
<h1 class="text-2xl font-bold mb-4">Precios del producto</h1>
<table class="du-table w-full">
  <tbody>
    <tr class="hover:bg-base-300 cursor-pointer" (click)="addProduct('unitPrice')">
        <td>Precio Unitario</td>
        <td>{{ product().unitPrice | currency }}</td>
    </tr>
    <tr class="hover:bg-base-300 cursor-pointer" (click)="addProduct('wholesalePrice')">
        <td>Precio Mayorista</td>
        <td>{{ product().wholesalePrice | currency }}</td>
    </tr>
  </tbody>
</table>
