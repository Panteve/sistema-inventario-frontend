<div class="du-toast">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="relative overflow-hidden flex items-center gap-3 px-4 py-3 pr-10 rounded-xl border min-w-40 md:max-w-sm max-w-70"
      [class.bg-green-50]="toast.type === 'success'"
      [class.border-green-500]="toast.type === 'success'"
      [class.text-green-800]="toast.type === 'success'"
      [class.bg-red-50]="toast.type === 'error'"
      [class.border-red-400]="toast.type === 'error'"
      [class.text-red-800]="toast.type === 'error'"
      [class.bg-amber-50]="toast.type === 'warning'"
      [class.border-amber-500]="toast.type === 'warning'"
      [class.text-amber-800]="toast.type === 'warning'"
      [class.bg-blue-50]="toast.type === 'info'"
      [class.border-blue-400]="toast.type === 'info'"
      [class.text-blue-900]="toast.type === 'info'"
    >
      <!-- Ícono -->
      <div
        class="w-8 h-8 rounded-full flex items-center justify-center shrink-0"
        [class.bg-green-200]="toast.type === 'success'"
        [class.bg-red-200]="toast.type === 'error'"
        [class.bg-amber-200]="toast.type === 'warning'"
        [class.bg-blue-200]="toast.type === 'info'"
      >
        @if (toast.type === 'success') {
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <polyline points="20 6 9 17 4 12" />
          </svg>
        } @else if (toast.type === 'error') {
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        } @else if (toast.type === 'warning') {
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"
            />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
        } @else if (toast.type === 'info') {
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="16" x2="12" y2="12" />
            <line x1="12" y1="8" x2="12.01" y2="8" />
          </svg>
        }
      </div>
      <button
        type="button"
        class="absolute right-2 top-2 flex h-6 w-6 items-center justify-center rounded-full transition hover:bg-black/10 cursor-pointer"
        aria-label="Cerrar notificación"
        (click)="this.toastService.remove(toast.id)"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
      <!-- Texto -->
      <div>
        <p class="text-sm font-bold capitalize tracking-wide">{{ toast.title || toast.type }}</p>
        <p class="text-sm">{{ toast.message }}</p>
      </div>
      <div class="toast-progress-track" aria-hidden="true">
        <div class="toast-progress-bar" [style.animation-duration.ms]="toast.duration"></div>
      </div>
    </div>
  }
</div>
